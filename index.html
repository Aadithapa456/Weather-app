<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script src="https://kit.fontawesome.com/bed699dc9b.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="weather-card flex">
      <div class="info-date">12/29/2024</div>
      <div class="weather-search flex">
        <input type="text" placeholder="Search your City" id="city-input" />
        <button><i class="fa-solid fa-magnifying-glass search"></i></button>
      </div>
      <div class="weather-info flex">
        <div class="info-img">
          <img
            src=" https://openweathermap.org/img/wn/10d@2x.png"
            alt="Icon of Current Weather State"
          />
        </div>
        <div class="info-temprature"><span>36</span><span>&#176;C</span></div>
        <div class="info-main-state">Cloudy</div>
        <div class="info-state-description"></div>
        <div class="info-city">Itahari</div>
      </div>
      <div class="weather-extra-info gap-10">
        <div class="air-pressure flex gap-14">
          <i class="fa-solid fa-gauge-simple-high"></i>
          <div class="pressure-info-section">
            <div class="pressure-info">1017 hPa</div>
            <div class="pressure-label">Air Pressure</div>
          </div>
        </div>
        <div class="wind-speed flex gap-14">
          <i class="fa-solid fa-arrow-right wind-direction-arrow"></i>
          <div class="wind-info-section">
            <div class="wind-info">3.0 m/s</div>
            <div class="wind-direction">at 45°</div>
            <div class="wind-label">Wind Speed</div>
          </div>
        </div>
        <div class="humidity flex gap-14">
          <i class="fa-solid fa-droplet"></i>
          <div class="humidity-info-section">
            <div class="humidity-info">16km/hr</div>
            <div class="humidity-label">Humidity</div>
          </div>
        </div>
      </div>
    </div>
    <div class="toast">
      <svg class="wave-icon" viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M0,256L11.4,240C22.9,224,46,192,69,192C91.4,192,114,224,137,234.7C160,245,183,235,206,213.3C228.6,192,251,160,274,149.3C297.1,139,320,149,343,181.3C365.7,213,389,267,411,282.7C434.3,299,457,277,480,250.7C502.9,224,526,192,549,181.3C571.4,171,594,181,617,208C640,235,663,277,686,256C708.6,235,731,149,754,122.7C777.1,96,800,128,823,165.3C845.7,203,869,245,891,224C914.3,203,937,117,960,112C982.9,107,1006,181,1029,197.3C1051.4,213,1074,171,1097,144C1120,117,1143,107,1166,133.3C1188.6,160,1211,224,1234,218.7C1257.1,213,1280,139,1303,133.3C1325.7,128,1349,192,1371,192C1394.3,192,1417,128,1429,96L1440,64L1440,320L1428.6,320C1417.1,320,1394,320,1371,320C1348.6,320,1326,320,1303,320C1280,320,1257,320,1234,320C1211.4,320,1189,320,1166,320C1142.9,320,1120,320,1097,320C1074.3,320,1051,320,1029,320C1005.7,320,983,320,960,320C937.1,320,914,320,891,320C868.6,320,846,320,823,320C800,320,777,320,754,320C731.4,320,709,320,686,320C662.9,320,640,320,617,320C594.3,320,571,320,549,320C525.7,320,503,320,480,320C457.1,320,434,320,411,320C388.6,320,366,320,343,320C320,320,297,320,274,320C251.4,320,229,320,206,320C182.9,320,160,320,137,320C114.3,320,91,320,69,320C45.7,320,23,320,11,320L0,320Z"
          fill-opacity="1"
        ></path>
      </svg>
      <div class="icon-container">
        <i class="fa-solid fa-triangle-exclamation error-icon"></i>
      </div>
      <div class="message-text-container">
        <p class="error-text">Error!</p>
        <p class="error-description">Unexpected error Occured</p>
      </div>
      <i class="fa-solid fa-x cross-icon"></i>
    </div>
    <footer class="flex">
      <i class="fa-solid fa-bolt bolt"></i>
      <p>Powered by</p>
      <a href="https://openweathermap.org/" target="_blank">Openweathermap API</a>
    </footer>
    <script type="module" src="script.js"></script>
  </body>
</html>
